version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - gosec
    - ineffassign
    - nilerr
    - nolintlint
    - staticcheck
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: []
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
