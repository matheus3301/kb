name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - name: Verify tag, main ancestry, and successful exact-commit CI
        run: python3 scripts/release.py verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make tools check

  publish:
    name: Publish GitHub release
    needs: verify
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - name: Require stable tap credential before publishing anything
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with Contents: write access to matheus3301/homebrew-tap."
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ steps.toolchain.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare checksummed Homebrew source formula
        if: ${{ !contains(github.ref_name, '-') }}
        run: python3 scripts/release.py formula
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          name: homebrew-formula
          path: .build/homebrew/kb.rb
          if-no-files-found: error
          retention-days: 30

  verify-published:
    name: Verify published native and source archives (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
      - name: Download this tag's published archives with independent identity expectations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          import release

          tag = release.release_tag(os.environ["GITHUB_REF_NAME"])
          version = tag[1:]
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          dist = Path(".build/dist")
          dist.mkdir(parents=True)
          filenames = [f"kb_{version}_{system}_{arch}.tar.gz"
                       for system in ("linux", "darwin") for arch in ("amd64", "arm64")]
          filenames += [f"kb_{version}_source.tar.gz", "checksums.txt"]
          command = ["gh", "release", "download", tag, "--repo", os.environ["GITHUB_REPOSITORY"], "--dir", str(dist)]
          for filename in filenames:
              command.extend(["--pattern", filename])
          subprocess.run(command, check=True)
          (dist / "metadata.json").write_text(json.dumps({"version": version, "commit": commit}) + "\n")
          PY
      - name: Prepare the temporary source-formula expectation
        run: python3 scripts/release.py formula
      - name: Exercise the published native archive and archived source on this host
        run: python3 scripts/check_release.py

  tap:
    name: Update Homebrew tap
    needs: [publish, verify-published]
    if: ${{ success() && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: kb-homebrew-tap
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the formula from this release run
        run: gh run download "$GITHUB_RUN_ID" --name homebrew-formula --dir .build/homebrew
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the formula with a tap-scoped token
        run: python3 scripts/release.py publish-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
