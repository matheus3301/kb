name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  repository:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - run: make repo

  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KB_SITE_BASE: /kb/
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        working-directory: .
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}
          package_json_file: site/package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-evidence
          path: .build/site/
          if-no-files-found: error
          retention-days: 7

  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.toolchain.outputs.golangci-lint }}
          install-only: true
          skip-cache: true
      - run: python3 scripts/quality.py install-tools actionlint
      - run: make lint

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - run: make test fuzz acceptance
      - run: make benchmark-smoke
      - run: make retrieval-eval
      - run: make soak-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-evidence-${{ matrix.os }}
          path: .build/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: Prior-version compatibility (${{ matrix.baseline.version }})
    strategy:
      fail-fast: false
      matrix:
        baseline:
          - version: v0.3.1
            commit: 2ca104f48cc4a6551f4bbc4fae12d51432e42dff
          - version: v0.4.0
            commit: 74f0d196408c1354899802e18ce569b0eab33adf
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KB_BASELINE_VERSION: ${{ matrix.baseline.version }}
      KB_BASELINE_COMMIT: ${{ matrix.baseline.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - name: Build the immutable previous release and current candidate
        run: |
          mkdir -p .build/compatibility-baseline
          test "$(git rev-parse "${KB_BASELINE_VERSION}^{commit}")" = "$KB_BASELINE_COMMIT"
          git archive "$KB_BASELINE_COMMIT" | tar -x -C .build/compatibility-baseline
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (
            cd .build/compatibility-baseline
            go build -trimpath -buildvcs=false -ldflags "-X main.version=$KB_BASELINE_VERSION -X main.commit=$KB_BASELINE_COMMIT" -o ../previous-kb ./cmd/kb
          )
          go build -trimpath -ldflags "-X main.version=qualification -X main.commit=$GITHUB_SHA" -o .build/candidate-kb ./cmd/kb
      - name: Exercise actual prior-version CLI and MCP upgrade workflows
        run: python3 scripts/compatibility.py --baseline .build/previous-kb --baseline-version "$KB_BASELINE_VERSION" --baseline-commit "$KB_BASELINE_COMMIT" --candidate .build/candidate-kb --candidate-version qualification --candidate-commit "$GITHUB_SHA" --output .build/compatibility.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-evidence-${{ matrix.baseline.version }}
          path: .build/compatibility.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: Cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - run: make build

  release-config:
    name: Release snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ steps.toolchain.outputs.goreleaser }}
          install-only: true
      - run: make release-snapshot

  security:
    name: Secrets and vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: toolchain
        run: python3 scripts/toolchain.py github-outputs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false
      - run: python3 scripts/quality.py install-tools gitleaks govulncheck
      - run: make security

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

  gate:
    name: CI gate
    if: always()
    needs: [repository, website, static, tests, security, build, release-config, compatibility, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every expected result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/quality.py gate
